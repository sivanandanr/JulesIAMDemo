<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">Account Discovery & Correlation</h1>
  <p class="text-gray-500">View status of accounts discovered across all applications and their correlation to identities.</p>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div *ngFor="let stat of discoveryStats" class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
      <div class="flex items-center space-x-3">
        <div [class]="'h-10 w-10 rounded-full flex items-center justify-center ' + stat.bg">
          <svg class="h-6 w-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </div>
        <div>
          <p class="text-sm font-medium text-gray-500">{{ stat.name }}</p>
          <p [class]="'text-2xl font-bold ' + stat.color">{{ stat.count }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white shadow rounded-lg overflow-hidden">
    <div class="px-6 py-4 border-b border-gray-200">
      <h2 class="text-lg font-medium text-gray-900">Uncorrelated Accounts</h2>
    </div>
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Account ID</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Reason</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let acc of unmatchedAccounts">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-gray-900">{{ acc.accountName }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ acc.source }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            <span class="px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-800 text-[10px] font-bold">{{ acc.reason }}</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button class="text-blue-600 hover:text-blue-900">Manual Correlate</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
