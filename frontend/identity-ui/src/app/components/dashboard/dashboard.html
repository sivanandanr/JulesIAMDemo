<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">Dashboard Overview</h1>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Stat Card 1 -->
    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-blue-600">
      <p class="text-sm font-medium text-gray-500 uppercase">Total Identities</p>
      <p class="mt-2 text-3xl font-semibold text-gray-900">{{ identityCount }}</p>
    </div>

    <!-- Stat Card 2 -->
    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-yellow-500">
      <p class="text-sm font-medium text-gray-500 uppercase">Pending Requests</p>
      <p class="mt-2 text-3xl font-semibold text-gray-900">{{ pendingRequestCount }}</p>
    </div>

    <!-- Stat Card 3 -->
    <div class="bg-white p-6 rounded-lg shadow-sm border-l-4 border-green-500">
      <p class="text-sm font-medium text-gray-500 uppercase">Active Entitlements</p>
      <p class="mt-2 text-3xl font-semibold text-gray-900">124</p>
    </div>
  </div>

  <div class="bg-white shadow-sm rounded-lg p-6">
    <h2 class="text-lg font-medium text-gray-900 mb-4">Recent Activity</h2>
    <div class="flow-root">
      <ul class="-mb-8">
        <li *ngFor="let request of recentRequests; let last = last">
          <div class="relative pb-8">
            <span *ngIf="!last" class="absolute top-4 left-4 -ml-px h-full w-0.5 bg-gray-200" aria-hidden="true"></span>
            <div class="relative flex space-x-3">
              <div>
                <span class="h-8 w-8 rounded-full bg-blue-500 flex items-center justify-center ring-8 ring-white text-white text-xs">
                  REQ
                </span>
              </div>
              <div class="min-w-0 flex-1 pt-1.5 flex justify-between space-x-4">
                <div>
                  <p class="text-sm text-gray-500">
                    {{ request.requesterName }} requested <span class="font-medium text-gray-900">{{ request.targetName }}</span> for {{ request.identityName }}
                  </p>
                </div>
                <div class="text-right text-sm whitespace-nowrap text-gray-500">
                  <time>{{ request.status }}</time>
                </div>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
