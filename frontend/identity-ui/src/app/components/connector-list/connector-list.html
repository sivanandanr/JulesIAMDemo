<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold text-gray-900">Managed Connectors</h1>
    <button class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Add Connector</button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let conn of connectors" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-6">
        <div class="flex items-center justify-between mb-4">
          <div class="h-12 w-12 bg-blue-100 rounded-lg flex items-center justify-center text-blue-600">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
          </div>
          <span [class]="'px-2 py-1 text-xs font-semibold rounded-full ' + (conn.status === 'Healthy' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800')">
            {{ conn.status }}
          </span>
        </div>
        <h3 class="text-lg font-bold text-gray-900">{{ conn.name }}</h3>
        <p class="text-sm text-gray-500 mb-4">{{ conn.type }} Connector • {{ conn.host }}</p>

        <div class="space-y-2">
          <p class="text-xs font-semibold text-gray-400 uppercase">Applications</p>
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let app of conn.applications" class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">
              {{ app.name }}
            </span>
            <span *ngIf="conn.applications.length === 0" class="text-xs text-gray-400 italic">No apps linked</span>
          </div>
        </div>
      </div>
      <div class="bg-gray-50 px-6 py-3 border-t border-gray-200">
        <a [routerLink]="['/connectors', conn.id]" class="text-sm font-medium text-blue-600 hover:text-blue-900">Configure Connector →</a>
      </div>
    </div>
  </div>
</div>
