<div class="space-y-6">
  <h1 class="text-2xl font-bold text-gray-900">Authoritative Sources</h1>
  <p class="text-gray-500">Manage trusted sources for identity lifecycle and data aggregation.</p>

  <div class="bg-white shadow overflow-hidden sm:rounded-md">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Source Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
          <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let source of sources">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ source.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ source.description }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            <span class="bg-blue-100 text-blue-800 text-[10px] px-2 py-0.5 rounded font-bold uppercase tracking-tight">Trusted</span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
            <button
              (click)="aggregate(source.id)"
              [disabled]="aggregatingIds.has(source.id)"
              class="bg-blue-600 text-white px-3 py-1 rounded hover:bg-blue-700 disabled:bg-blue-300"
            >
              {{ aggregatingIds.has(source.id) ? 'Aggregating...' : 'Aggregate Now' }}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
